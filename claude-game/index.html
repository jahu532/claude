<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; top: 12px; left: 16px; color: #fff; font-size: 18px; line-height: 1.5;
         text-shadow: 0 0 8px #2f6bff88, 0 1px 3px #000; pointer-events: none; }
  #fxhud { position: fixed; top: 12px; right: 16px; color: #fff; font-size: 16px; line-height: 1.6; text-align: right;
           text-shadow: 0 1px 4px #000a; pointer-events: none; }
  #toast { position: fixed; bottom: 14%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 26px;
           text-shadow: 0 2px 8px #000c; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #02040acc; color: #e6efff; }
  .panel { background: #070c1a; border: 1px solid #1f3b8f; border-radius: 14px; padding: 28px 36px; max-width: 760px; width: calc(100% - 32px);
           box-shadow: 0 0 40px #1f4fd855; text-align: center; box-sizing: border-box; max-height: 94vh; overflow: auto; }
  .panel h1 { margin: 0 0 4px; font-size: 40px; color: #4aa3ff; text-shadow: 0 0 18px #2f6bff; }
  .panel h2 { margin: 0 0 16px; font-size: 20px; font-weight: 400; opacity: .8; }
  .panel p { margin: 6px 0; opacity: .85; }
  .help { font-size: 14px; line-height: 1.6; margin-top: 18px; opacity: .75; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  button { font: inherit; color: #fff; background: #1f4fd8; border: 1px solid #3d8bff; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  button:hover:not(:disabled) { background: #3d8bff; }
  button:disabled { background: #0d1426; border-color: #1b2338; color: #5b6784; cursor: not-allowed; }
  button.card { text-align: left; padding: 12px 14px; }
  button.card small { display: block; opacity: .75; margin-top: 4px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="fxhud"></div>
<div id="toast"></div>
<div id="overlay"></div>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script type="module" src="./game.js"></script>
</body>
</html>
